<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151d2e"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ab8ff"/>
      <stop offset="100%" stop-color="#4d9eff"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d9eff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a87aff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundRect">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" clip-path="url(#roundRect)">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#4d9eff" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#4d9eff" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#4d9eff" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#4d9eff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#4d9eff" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#4d9eff" stroke-width="1"/>
  </g>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#4d9eff" stroke-width="1" opacity="0.08"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#4d9eff" stroke-width="0.5" opacity="0.05"/>

  <!-- Track arc (background) — 270° sweep, starts at 225° -->
  <!-- Using SVG arc: start at 225° = bottom-left, sweep CW 270° -->
  <!-- 225° in SVG coords (y-down): start x=256+175*cos(225°)=256-123.7=132.3, y=256-175*sin(225°)=256+123.7=379.7 -->
  <!-- end point (225°-270°=-45°=315°): x=256+175*cos(315°)=256+123.7=379.7, y=256-175*sin(315°)=256+123.7=379.7 -->
  <path
    d="M 132.3 379.7 A 175 175 0 1 1 379.7 379.7"
    fill="none"
    stroke="#1a2438"
    stroke-width="32"
    stroke-linecap="round"/>

  <!-- Value arc — ~78% filled -->
  <path
    d="M 132.3 379.7 A 175 175 0 1 1 379.7 379.7"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-dasharray="856 1100"
    filter="url(#glow)"
    opacity="0.95"/>

  <!-- Tick marks on the arc -->
  <g stroke="#2a3f5f" stroke-width="2" opacity="0.7">
    <!-- 10 ticks evenly spaced on 270° arc -->
    <line x1="256" y1="68" x2="256" y2="88" transform="rotate(-135 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(-108 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(-81 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(-54 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(-27 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="88" transform="rotate(0 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(27 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(54 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(81 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="80" transform="rotate(108 256 256)"/>
    <line x1="256" y1="68" x2="256" y2="88" transform="rotate(135 256 256)"/>
  </g>

  <!-- Glowing arc tip dot -->
  <!-- Tip is at 78% of 270° = 210.6° from start = 225° - 210.6° = 14.4° SVG angle -->
  <!-- x = 256 + 175*cos(14.4°) = 256+169.5=425.5, y = 256 - 175*sin(14.4°) = 256-43.5=212.5 -->
  <circle cx="390" cy="155" r="18" fill="#4d9eff" opacity="0.2" filter="url(#softglow)"/>
  <circle cx="390" cy="155" r="10" fill="#4d9eff" opacity="0.9"/>

  <!-- Inner circle background -->
  <circle cx="256" cy="256" r="128" fill="#0a0e14" opacity="0.95"/>
  <circle cx="256" cy="256" r="128" fill="url(#hexGrad)"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#1e2d45" stroke-width="1.5"/>

  <!-- Center: "HW" text mark -->
  <text
    x="256" y="242"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="68"
    font-weight="800"
    letter-spacing="-4"
    fill="#e8eef8">HW</text>

  <!-- Subtitle "SONNET" -->
  <text
    x="256" y="292"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif"
    font-size="26"
    font-weight="600"
    letter-spacing="8"
    fill="#4d9eff"
    opacity="0.9">SONNET</text>

  <!-- Small dot decorations -->
  <circle cx="256" cy="320" r="3" fill="#4d9eff" opacity="0.5"/>
  <circle cx="244" cy="320" r="2" fill="#4d9eff" opacity="0.25"/>
  <circle cx="268" cy="320" r="2" fill="#4d9eff" opacity="0.25"/>

  <!-- Bottom border glow -->
  <rect x="0" y="490" width="512" height="22" rx="0" fill="url(#arcGrad)" opacity="0.04"/>
</svg>
